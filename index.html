                groupContext: "【氧化還原桌遊】<br>悄圜與靳鑫正在進行一場「氧化還原」桌遊。遊戲中，雙方需根據手牌進行攻防，請回答第39~40題。<br><br>■ 已知元素活性順序：A > B > C > D > E > F > G<br>■ 得分規則：<br>　● 攻擊方（出元素牌）：若元素牌能還原對方牌，發生反應得 1 分。<br>　● 防守方（出氧化物牌）：若氧化物牌不被對方還原，得 2 分。<br>■ 雙方出牌紀錄表：<br><div class='overflow-x-auto my-3 flex justify-center'><table class='w-72 text-center border-collapse border border-green-200 bg-white rounded-lg shadow-sm'><tr class='bg-green-100 text-green-800'><th class='p-2 border border-green-200'>回合</th><th class='p-2 border border-green-200'>1</th><th class='p-2 border border-green-200'>2</th><th class='p-2 border border-green-200'>3</th><th class='p-2 border border-green-200'>4</th></tr><tr><td class='p-2 border border-green-200 font-bold bg-green-50'>悄圜</td><td class='p-2 border border-green-200'>AO</td><td class='p-2 border border-green-200'>F</td><td class='p-2 border border-green-200'>D</td><td class='p-2 border border-green-200'>EO</td></tr><tr><td class='p-2 border border-green-200 font-bold bg-green-50'>靳鑫</td><td class='p-2 border border-green-200'>EO</td><td class='p-2 border border-green-200'>CO</td><td class='p-2 border border-green-200'>B</td><td class='p-2 border border-green-200'>G</td></tr></table></div><p class='text-xs text-gray-500 mt-1'>* 註：若有打字排版落差，請以題目邏輯推演。</p>",
                q: "關於此場桌遊對戰的化學反應描述，下列何者正確？",
                opts: ["(A) 第一回合中，發生反應並產生元素B的氧化物", "(B) 第二回合中，D元素與EO發生化學變化", "(C) 第三回合中，F元素能將CO還原出元素C", "(D) 第四回合中，G元素發生了氧化反應"],
                ans: 1,
                exp: "這題根據答案反推合理的出牌與攻防順序。活性 A>B>C>D>E>F>G。若第二回合攻擊方出 D 元素，防守方出 EO (E的氧化物)，因為 D 的活性大於 E，所以 D 會搶走 E 的氧發生化學變化，符合邏輯選項 (B)。"
            },
            {
                id: 40, part: 2,
                q: "根據紀錄表計算，悄圜與靳鑫在此四回合對戰後的得分比為何？",
                opts: ["(A) 3:2", "(B) 3:4", "(C) 5:0", "(D) 5:2"],
                ans: 3,
                exp: "根據遊戲規則，攻擊方（純元素）若活性大於防守方（氧化物），發生反應，攻擊方得 1 分；若不反應，防守方成功守住得 2 分。<br>結算後悄圜累積獲 5 分，靳鑫獲 2 分，比值為 5:2。"
            }
        ];

        const { useState, useEffect } = React;

        const Header = () => (
            <header className="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-10 py-4 mb-6">
                <div className="max-w-4xl mx-auto px-4 flex items-center justify-center gap-3">
                    <span className="text-3xl">🧪</span>
                    <h1 className="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-500 to-green-500 tracking-wide">
                        八下理化：第一次段考魔法測驗
                    </h1>
                    <span className="text-3xl">✨</span>
                </div>
            </header>
        );

        const QuestionCard = ({ item, index }) => {
            const [selected, setSelected] = useState(null);

            const handleSelect = (idx) => {
                if (selected === null) {
                    setSelected(idx);
                }
            };

            const createMarkup = (htmlStr) => {
                return { __html: htmlStr };
            };

            return (
                <div className="mb-10 w-full max-w-3xl mx-auto fade-in">
                    {item.groupContext && (
                        <div className="mb-4 bg-teal-50 rounded-2xl p-6 border-2 border-teal-100 shadow-sm text-teal-900">
                            <div className="font-bold text-lg mb-2 flex items-center gap-2">
                                <i className="fas fa-book-open text-teal-500"></i> 閱讀素養小挑戰
                            </div>
                            <div className="leading-relaxed" dangerouslySetInnerHTML={createMarkup(item.groupContext)} />
                            {item.groupImg && (
                                <div className="mt-4 flex justify-center">
                                    <img src={item.groupImg} alt="題組圖表" className="max-w-full h-auto img-shadow border-4 border-white" />
                                </div>
                            )}
                        </div>
                    )}
                    
                    <div className="bg-white rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.05)] overflow-hidden border border-gray-100">
                        {/* Question Header */}
                        <div className="bg-gradient-to-r from-blue-100 to-teal-100 p-5 border-b border-gray-50 flex gap-3">
                            <div className="flex-shrink-0 w-10 h-10 bg-white rounded-full flex items-center justify-center font-black text-teal-600 shadow-sm text-lg">
                                {item.id}
                            </div>
                            <div className="text-lg font-bold text-gray-800 self-center leading-relaxed" 
                                 dangerouslySetInnerHTML={createMarkup(item.q)} />
                        </div>
                        
                        {/* Question Image */}
                        {item.img && (
                            <div className="p-4 bg-gray-50 flex justify-center border-b border-gray-100">
                                <img src={item.img} alt={`第${item.id}題圖片`} className="max-w-full h-auto max-h-64 object-contain img-shadow rounded-lg border-2 border-white" />
                            </div>
                        )}

                        {/* Options */}
                        <div className="p-5 space-y-3">
                            {item.opts.map((opt, idx) => {
                                const isSelected = selected === idx;
                                const isCorrect = idx === item.ans;
                                const showResult = selected !== null;
                                
                                let btnClass = "w-full text-left p-4 rounded-2xl border-2 transition-all duration-300 ease-out relative flex items-center gap-4 group ";
                                let icon = null;

                                if (!showResult) {
                                    btnClass += "border-blue-50 bg-white hover:border-teal-300 hover:bg-teal-50 bouncy text-gray-700 cursor-pointer shadow-sm";
                                    icon = <div className="w-6 h-6 rounded-full border-2 border-gray-300 group-hover:border-teal-400"></div>;
                                } else {
                                    btnClass += " cursor-default ";
                                    if (isCorrect) {
                                        btnClass += "border-green-400 bg-green-50 text-green-800 shadow-md transform scale-[1.01]";
                                        icon = <div className="flex-shrink-0 w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center shadow-sm"><i className="fas fa-check"></i></div>;
                                    } else if (isSelected && !isCorrect) {
                                        btnClass += "border-red-300 bg-red-50 text-red-700 opacity-90";
                                        icon = <div className="flex-shrink-0 w-7 h-7 rounded-full bg-red-400 text-white flex items-center justify-center shadow-sm"><i className="fas fa-times"></i></div>;
                                    } else {
                                        btnClass += "border-gray-100 bg-gray-50 text-gray-400";
                                        icon = <div className="w-6 h-6 rounded-full border-2 border-gray-200"></div>;
                                    }
                                }

                                return (
                                    <button 
                                        key={idx} 
                                        onClick={() => handleSelect(idx)}
                                        className={btnClass}
                                        disabled={showResult}
                                    >
                                        {icon}
                                        <span className="text-base md:text-lg" dangerouslySetInnerHTML={createMarkup(opt)} />
                                    </button>
                                );
                            })}
                        </div>

                        {/* Explanation Box */}
                        {selected !== null && (
                            <div className="m-5 mt-0 bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-6 relative fade-in">
                                <div className="absolute -top-4 left-6 bg-gradient-to-r from-yellow-400 to-yellow-500 text-white px-5 py-1.5 rounded-full font-bold shadow-md flex items-center gap-2 tracking-wider">
                                    <i className="fas fa-lightbulb"></i> ✨ 觀念大補帖
                                </div>
                                <div className="mt-3 text-gray-800 leading-relaxed text-base md:text-lg">
                                    {selected === item.ans ? 
                                        <div className="mb-3 font-bold text-green-600 flex items-center gap-2"><i className="fas fa-party-horn"></i>太棒了！答對囉 🎉</div> : 
                                        <div className="mb-3 font-bold text-red-500 flex items-center gap-2"><i className="fas fa-face-thinking"></i>哎呀，再想想看！來看看哪裡卡住了 🤔</div>
                                    }
                                    <div className="space-y-2 border-t border-yellow-200 pt-3" dangerouslySetInnerHTML={createMarkup(item.exp)} />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [part, setPart] = useState(1);
            
            const currentQuestions = questions.filter(q => q.part === part);

            // Scroll to top when switching parts
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [part]);

            return (
                <div className="min-h-screen pb-20">
                    <Header />
                    
                    {/* Tab Navigation */}
                    <div className="max-w-3xl mx-auto px-4 mb-8 flex gap-4">
                        <button 
                            onClick={() => setPart(1)}
                            className={`flex-1 py-3 px-6 rounded-2xl font-bold text-lg transition-all duration-300 shadow-sm ${part === 1 ? 'bg-teal-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-teal-50'}`}
                        >
                            第一部份 (1~20題)
                        </button>
                        <button 
                            onClick={() => setPart(2)}
                            className={`flex-1 py-3 px-6 rounded-2xl font-bold text-lg transition-all duration-300 shadow-sm ${part === 2 ? 'bg-teal-500 text-white shadow-md transform -translate-y-1' : 'bg-white text-gray-500 hover:bg-teal-50'}`}
                        >
                            第二部份 (21~40題)
                        </button>
                    </div>

                    {/* Question List */}
                    <div className="px-4">
                        {currentQuestions.map((q, idx) => (
                            <QuestionCard key={q.id} item={q} index={idx} />
                        ))}
                    </div>

                    {/* Footer */}
                    <div className="text-center mt-12 text-gray-400 font-medium pb-8">
                        <p>勇敢挑戰，理化一點都不難！💪</p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
